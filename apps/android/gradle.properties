# Aethelred Wallet — Gradle JVM + Android + Kotlin tuning knobs.
#
# These values are intentionally conservative for shared dev machines and
# CI runners. Bump `org.gradle.jvmargs` heap if you see OOMs in release
# builds with R8 minification enabled.

# JVM settings — Gradle daemon heap and file encoding.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Daemon + parallel builds + config cache keep incremental builds fast.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is mandatory on modern SDKs; the legacy support library is gone.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin compiler — official code style and incremental compilation.
kotlin.code.style=official
kotlin.incremental=true

# Kotlin 2.0 explicit API mode across production modules. Test modules
# opt out individually where the overhead isn't worth it.
kotlin.explicitApi=strict

# Compose compiler metrics land in `build/compose-metrics` per module.
# Leave off by default; flip on when hunting down recomposition hotspots.
composeMetrics=false
composeReports=false
