# XcodeGen spec — generates AethelredWallet.xcodeproj
#
# Usage:
#   brew install xcodegen
#   cd apps/ios
#   xcodegen generate
#
# The .xcodeproj directory this sits inside is intentionally a placeholder;
# when you first run `xcodegen generate` it will materialize the full
# project.pbxproj and supporting files. DO NOT hand-edit the resulting
# project.pbxproj — this spec is the source of truth.

name: AethelredWallet
options:
  bundleIdPrefix: network.aethelred
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # supply during provisioning
    CODE_SIGN_STYLE: Automatic

targets:
  AethelredWallet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AethelredWallet
    resources:
      - path: AethelredWallet/Assets.xcassets
    info:
      path: AethelredWallet/Info.plist
      properties:
        CFBundleDisplayName: Aethelred
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: YES
        NSFaceIDUsageDescription: "Aethelred uses Face ID to unlock the wallet and authorize every signature."
        NSCameraUsageDescription: "Aethelred uses the camera to scan WalletConnect QR codes."
        ITSAppUsesNonExemptEncryption: NO
        CFBundleURLTypes:
          - CFBundleURLName: network.aethelred.walletconnect
            CFBundleURLSchemes:
              - wc
              - aethelred
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: NO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.aethelred.wallet
        INFOPLIST_FILE: AethelredWallet/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for phase 0
    entitlements:
      path: AethelredWallet/AethelredWallet.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)network.aethelred.wallet
        com.apple.security.application-groups:
          - group.network.aethelred.wallet
        com.apple.developer.associated-domains:
          - "webcredentials:aethelred.network"
          - "applinks:aethelred.network"
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: YES
        com.apple.developer.background-tasks:
          - network.aethelred.wallet.bg.balance-refresh
          - network.aethelred.wallet.bg.pending-tx-poll
          - network.aethelred.wallet.bg.audit-batch-finalize
    dependencies:
      - target: AethelredWalletWidget
        embed: true

  AethelredWalletWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AethelredWalletWidget
    info:
      path: AethelredWalletWidget/Info.plist
      properties:
        CFBundleDisplayName: Aethelred Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.aethelred.wallet.widget
        INFOPLIST_FILE: AethelredWalletWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: AethelredWalletWidget/AethelredWalletWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.network.aethelred.wallet

  AethelredWalletTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AethelredWalletTests
    dependencies:
      - target: AethelredWallet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.aethelred.wallet.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AethelredWallet:
    build:
      targets:
        AethelredWallet: all
        AethelredWalletTests: [test]
        AethelredWalletWidget: [run, archive]
    test:
      config: Debug
      targets:
        - AethelredWalletTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
