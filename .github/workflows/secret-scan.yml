# ═══════════════════════════════════════════════════════════════
# Aethelred Wallet — Secret scanning (TruffleHog)
# ═══════════════════════════════════════════════════════════════
# GitHub's built-in push protection catches the common detector
# patterns (AWS, GCP, Slack, etc.). TruffleHog runs an independent
# scan with a broader rule set and ALSO supports a custom ruleset
# at .trufflehog/aethelred.yml for Aethelred-specific token
# formats (control-plane API keys, our JWT format, Ledger device
# attestation keys).
#
# Two schedules:
#   - On every PR: scan the diff against main, fail the check if
#     a finding is verified (has been confirmed by the detector
#     to be a live credential, not just a pattern match).
#   - Weekly cron: scan full git history so rotated-but-not-purged
#     secrets don't hide in old commits.

name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Sunday 05:00 UTC — staggered after CodeQL run.
  schedule:
    - cron: '0 5 * * 0'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        # actions/checkout@v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # fetch-depth: 0 is required so trufflehog can walk the
          # entire git log on the weekly cron run. For PR runs the
          # action only scans the diff, so the history cost is
          # one-time per CI run (~2-4 seconds on our repo size).
          fetch-depth: 0

      - name: TruffleHog OSS
        # trufflesecurity/trufflehog@v3.94.3 — pinned to an immutable
        # commit SHA so a hostile tag-rewrite cannot silently swap
        # scan logic into our CI. Bump both lines together when
        # rotating versions.
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6
        with:
          # base and head default to the pre-PR and PR-head commits
          # on pull_request; on schedule/push we scan everything by
          # leaving them unset and relying on the --since-commit
          # fallback that the action handles.
          path: ./
          # Fail the workflow when TruffleHog verifies a finding
          # against the remote service (i.e. confirms the secret
          # is active). Pattern-only matches are surfaced as
          # warnings, not failures.
          extra_args: >-
            --only-verified
            --config=.trufflehog/aethelred.yml
