# ═══════════════════════════════════════════════════════════════
# Aethelred Wallet — OpenSSF Scorecard
# ═══════════════════════════════════════════════════════════════
# Runs the OpenSSF Scorecard checks weekly and posts the results
# to GitHub code scanning as SARIF. The Scorecard score becomes a
# README badge once the workflow has run at least once and
# populated the cache.
#
# What Scorecard measures (relevant to the wallet):
#   - Branch protection on main
#   - Code review policy enforcement
#   - Dependency pinning (pinned-dependencies)
#   - Signed commits / signed releases
#   - CI + CodeQL + Dependabot presence
#   - SAST / secret-scanning / license enforcement
#   - No binary artifacts checked into the repo
#
# Many of these are now enforced by the other workflows in this
# directory; Scorecard provides an independent audit and a
# publicly-visible score that security-conscious users can consult.

name: OpenSSF Scorecard

on:
  # Weekly on Monday 06:00 UTC — runs after CodeQL, semgrep, and
  # secret-scan so Scorecard sees the latest SARIF feed.
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to upload SARIF results.
      security-events: write
      # Required for identity verification on scorecard
      # publishing pipeline.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        # ossf/scorecard-action@v2.4.0.
        #
        # `continue-on-error: true` — Scorecard's branch-protection +
        # webhook + commit-history checks require elevated GitHub
        # API permissions that GITHUB_TOKEN doesn't grant against
        # PRIVATE repositories. For private repos, ossf/scorecard
        # documents using a Personal Access Token secret
        # (`SCORECARD_READ_TOKEN`) with `repo` + `read:org` scopes.
        # Until that PAT is added, Scorecard fails with
        #   "scorecard.Run: internal error: ListCommits: Resource
        #    not accessible by integration"
        # on the ListCommits GraphQL query. The check is
        # informational — its measured signals (branch protection,
        # dependency pinning, SAST presence, secret scanning) are
        # ALREADY enforced by our other workflows (branch-protection
        # API config, semgrep, trufflehog, dependabot). Keep the
        # workflow in place so turning it on later is a one-line
        # removal of this continue-on-error flag + adding the PAT.
        continue-on-error: true
        id: scorecard
        # ossf/scorecard-action@v2.4.0
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results: true publishes the score to the
          # OpenSSF public feed so other tools can consume it and
          # the README badge endpoint can resolve. For private
          # repos without a PAT this is a no-op.
          publish_results: true
          # When the PAT is added, swap GITHUB_TOKEN for the PAT:
          # repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}

      - name: Upload Scorecard artifact
        # Only runs if Scorecard produced a SARIF; for the
        # private-repo-without-PAT case the file won't exist and
        # we skip gracefully.
        if: steps.scorecard.outcome == 'success'
        # actions/upload-artifact@v4.4.3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90
          if-no-files-found: error

      - name: Upload Scorecard SARIF to code scanning
        if: steps.scorecard.outcome == 'success'
        # github/codeql-action/upload-sarif@v3.26.12
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7
        with:
          sarif_file: results.sarif
          category: scorecard
