# Aethelred Wallet — Property tests (high-iteration, on-merge).
# On merge to main, re-runs property + fuzz suites at 5000 iterations
# each. No untrusted inputs are interpolated into any run-block.

name: Property tests (extended)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.0'
  FAST_CHECK_NUM_RUNS: '5000'

concurrency:
  group: property-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property:
    name: Property + fuzz (extended)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run property + fuzz
        run: npx vitest run property fuzz
        working-directory: apps/extension
