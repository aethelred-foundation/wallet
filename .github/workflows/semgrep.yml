# ═══════════════════════════════════════════════════════════════
# Aethelred Wallet — Semgrep SAST scan
# ═══════════════════════════════════════════════════════════════
# Runs the Semgrep static-analysis engine on every pull request
# and every push to main, with three proven community rulesets
# (OWASP Top 10, JavaScript, TypeScript, Supply Chain) plus a
# local ruleset `.semgrep/aethelred.yml` that encodes wallet-
# specific invariants (no Math.random in crypto-adjacent files,
# no localStorage for secrets, throw statements carry codes, etc).
#
# SARIF output is uploaded to GitHub code scanning so findings
# render inline in the PR diff and alerts flow into the security
# tab next to CodeQL, Dependabot, and secret-scanning alerts.
#
# Action pinning:
#   All actions are pinned to a full 40-char commit SHA rather
#   than a @v1 or @main tag. Tag-based pins are mutable — a
#   compromised maintainer account can force-push a tag to a
#   malicious commit. Pinning to a SHA eliminates that vector.
#   When upgrading, update the SHA and the trailing comment
#   together so the version is auditable at a glance.

name: Semgrep SAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly baseline scan to catch rule-set updates that flag
  # pre-existing code.
  schedule:
    - cron: '0 4 * * 1'
  workflow_call:

permissions:
  contents: read
  # security-events: write is required to upload SARIF findings
  # to GitHub code scanning.
  security-events: write
  # actions: read is needed so the SARIF uploader can link back
  # to the workflow run that produced the scan.
  actions: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The semgrep/semgrep image has semgrep pre-installed; running
    # inside the container avoids a pip install step. Pin is an
    # immutable manifest digest, not a rolling tag — a hostile
    # tag-rewrite cannot swap scan rules under us. Current pin maps
    # to semgrep/semgrep:1.160.0 (latest at 2026-04-20); bump both
    # the comment and the digest together when rotating versions.
    container:
      image: semgrep/semgrep@sha256:7810f1d7884974ab6dda7bef8f4a2c8e165ea2142fd8260515d380e4f1407263
    steps:
      - name: Checkout repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Semgrep scan (community rulesets + local ruleset)
        env:
          # SEMGREP_RULES references remote rule bundles plus our
          # local file. Semgrep resolves the `p/` prefix against
          # the public registry.
          SEMGREP_RULES: >-
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/supply-chain
            .semgrep/aethelred.yml
        run: |
          semgrep ci \
            --sarif \
            --output=semgrep.sarif \
            --metrics=off \
            --error

      - name: Upload SARIF to GitHub code scanning
        if: always()
        # github/codeql-action/upload-sarif@v3.26.12
        uses: github/codeql-action/upload-sarif@396bb3e45325a47dd9ef434068033c6d5bb0d11a
        with:
          sarif_file: semgrep.sarif
          category: semgrep
