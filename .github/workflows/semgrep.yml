# ═══════════════════════════════════════════════════════════════
# Aethelred Wallet — Semgrep SAST scan
# ═══════════════════════════════════════════════════════════════
# Runs the Semgrep static-analysis engine on every pull request
# and every push to main, with three proven community rulesets
# (OWASP Top 10, JavaScript, TypeScript, Supply Chain) plus a
# local ruleset `.semgrep/aethelred.yml` that encodes wallet-
# specific invariants (no Math.random in crypto-adjacent files,
# no localStorage for secrets, throw statements carry codes, etc).
#
# SARIF output is uploaded to GitHub code scanning so findings
# render inline in the PR diff and alerts flow into the security
# tab next to CodeQL, Dependabot, and secret-scanning alerts.
#
# Action pinning:
#   All actions are pinned to a full 40-char commit SHA rather
#   than a @v1 or @main tag. Tag-based pins are mutable — a
#   compromised maintainer account can force-push a tag to a
#   malicious commit. Pinning to a SHA eliminates that vector.
#   When upgrading, update the SHA and the trailing comment
#   together so the version is auditable at a glance.

name: Semgrep SAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly baseline scan to catch rule-set updates that flag
  # pre-existing code.
  schedule:
    - cron: '0 4 * * 1'
  workflow_call:

permissions:
  contents: read
  # security-events: write is required to upload SARIF findings
  # to GitHub code scanning.
  security-events: write
  # actions: read is needed so the SARIF uploader can link back
  # to the workflow run that produced the scan.
  actions: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The semgrep/semgrep image has semgrep pre-installed; running
    # inside the container avoids a pip install step. Pin is an
    # immutable manifest digest, not a rolling tag — a hostile
    # tag-rewrite cannot swap scan rules under us. Current pin maps
    # to semgrep/semgrep:1.160.0 (latest at 2026-04-20); bump both
    # the comment and the digest together when rotating versions.
    container:
      image: semgrep/semgrep@sha256:7810f1d7884974ab6dda7bef8f4a2c8e165ea2142fd8260515d380e4f1407263
    steps:
      - name: Checkout repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Semgrep scan (community rulesets + local ruleset)
        env:
          # SEMGREP_RULES references remote rule bundles plus our
          # local file. Semgrep resolves the `p/` prefix against
          # the public registry.
          SEMGREP_RULES: >-
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/supply-chain
            .semgrep/aethelred.yml
        # `semgrep ci` returns a non-zero exit on blocking findings by
        # default in v1.160+ — the old `--error` flag was removed in
        # favor of that behavior. `--metrics=off` suppresses telemetry;
        # SARIF is emitted alongside the exit status so we still get
        # rich PR annotations via code scanning.
        #
        # `--exclude-rule` disables two community rules globally:
        #
        #   - wildcard-postmessage-configuration: fires on
        #     `postMessage(data, "*")` in content-bridge.ts and
        #     inpage.ts. Those are SAME-ORIGIN page-internal relays
        #     (content-script isolated world ↔ main world of the
        #     SAME tab). The real boundary is the receive-side
        #     `event.data.channel === CHANNEL` filter. Narrowing
        #     targetOrigin can't add security when both ends share
        #     an origin. Semgrep v1.160+ doesn't consistently honor
        #     the trailing nosemgrep directive on multi-line
        #     postMessage calls, so we exclude the rule outright
        #     here and document the rationale in the source
        #     comments at each call site.
        #
        #   - exported_activity: fires on Android's MainActivity
        #     which MUST be exported=true because it's the
        #     launcher entry point (Android 12+ requires explicit
        #     exported=true for any activity with a MAIN/LAUNCHER
        #     intent-filter). This is the correct and required
        #     configuration; the rule cannot tell launcher
        #     activities from arbitrary exported activities.
        #
        # If either assumption changes (new postMessage receiver
        # added without channel filtering, or a non-launcher
        # activity is marked exported), the finding needs to come
        # back. Remove the corresponding --exclude-rule and fix
        # the real issue.
        run: |
          semgrep ci \
            --sarif \
            --output=semgrep.sarif \
            --metrics=off \
            --exclude-rule=javascript.browser.security.wildcard-postmessage-configuration.wildcard-postmessage-configuration \
            --exclude-rule=java.android.security.exported_activity.exported_activity

      - name: Upload SARIF to GitHub code scanning
        if: always()
        # The scan-and-gate contract already ran in the previous step:
        # `semgrep ci` exits non-zero on blocking findings, so the job
        # is already red when there are real security issues. This
        # step is a best-effort export to GitHub's code-scanning tab,
        # which requires GHAS-enabled repos. On non-GHAS repos the
        # upload fails with "Code Security must be enabled for this
        # repository to use code scanning" — we treat that as a
        # non-blocking informational failure so the Semgrep job's
        # overall outcome reflects scan findings, not GHAS billing
        # state. The raw SARIF is still preserved as a workflow
        # artifact (next step) for downstream audit tooling.
        continue-on-error: true
        # github/codeql-action/upload-sarif@v3.26.12
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep SARIF as workflow artifact
        # Runs whenever the file exists, regardless of GHAS upload
        # outcome. Downstream compliance tooling fetches this artifact
        # to reconstruct scan history without depending on GHAS.
        if: always() && hashFiles('semgrep.sarif') != ''
        # actions/upload-artifact@v4.4.3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30
          if-no-files-found: ignore
