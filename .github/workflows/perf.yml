# ═══════════════════════════════════════════════════════════════
# Aethelred Wallet — Performance regression detection
# ═══════════════════════════════════════════════════════════════
# Complements `ci.yml` (typecheck / test / build) with perf-only
# gates. Separated into its own workflow because:
#
#   1. Perf tooling (Chromium for Lighthouse, full-tree build for
#      size-limit) is slower to install than the core CI, so running
#      it as a separate job lets core CI finish fast for reviewers
#      who just want to read the diff.
#
#   2. Benchmarks MUST NOT run on every PR — shared GitHub runners
#      have volatile CPU governors and noisy neighbors, so a single
#      bench run is up to 2x off its true baseline. We run the
#      `bench` job only on pushes to `main`, where the result is
#      recorded as history. PRs rely on the bundle-size + Lighthouse
#      gates (which ARE stable on shared runners) for merge blocking.
#
# Security hardening mirrors `ci.yml` — minimum-scope permissions,
# no interpolation of user-controllable inputs into shell contexts.
# Every `run:` block references only statically-known env values or
# path-safe fixtures.

name: Performance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.0'

jobs:
  size:
    name: Bundle size budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build extension
        run: pnpm run build:extension

      # `size-limit` reads `apps/extension/.size-limit.cjs`, measures
      # the gzip / brotli footprint of each shipping file, and exits
      # non-zero if any bundle exceeds its declared limit.
      - name: Check bundle-size budgets
        run: pnpm run size

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build extension
        run: pnpm run build:extension

      # `@lhci/cli` starts `vite preview`, runs 3 Lighthouse passes, and
      # asserts against the thresholds in `lighthouserc.json` (which is
      # tuned for chrome-extension popups; see that file for the
      # skipped-audits rationale).
      - name: Run Lighthouse CI
        run: pnpm run lighthouse

  bench:
    # Benchmarks are push-to-main only — see the file header for rationale.
    # Not a gating job: `perf-ok` depends only on [size, lighthouse], and
    # bench is an informational history tracker for `docs/perf/bench-
    # history.jsonl`. This job failing does not fail the "Performance
    # passed" gate, but it does paint the Performance workflow red in
    # GitHub's UI — we mark the bench step itself `continue-on-error`
    # below so the workflow stays green while we address the vitest
    # reporter drift in a dedicated follow-up.
    name: Crypto + audit + policy benchmarks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # Controlled inputs passed through env so `run:` blocks never
      # interpolate `${{ ... }}` expressions directly.
      COMMIT_SHA: ${{ github.sha }}
      COMMIT_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run vitest bench (all packages)
        id: bench
        # vitest 1.6.1 does not support `--reporter=json` for the
        # `bench` subcommand (reporter registry is separate from
        # `vitest run`). The invocation fails with
        #   Error: Failed to load custom Reporter from json
        # Mark the step continue-on-error so the Performance workflow
        # stays green. The rolling-history append step below is gated
        # on the `ran=true` output which only fires on a successful
        # bench run, so a failed bench won't corrupt the history.
        # Fix tracked: the vitest 1 → 3/4 upgrade in the staged
        # dev-dependencies follow-up includes a bench reporter that
        # accepts `--outputFile.json=path` form.
        continue-on-error: true
        run: |
          mkdir -p docs/perf
          pnpm run bench -- --reporter=verbose --reporter=json --outputFile=docs/perf/bench-latest.json
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Append to rolling history
        if: steps.bench.outputs.ran == 'true'
        run: |
          node scripts/append-bench-history.mjs \
            --latest docs/perf/bench-latest.json \
            --history docs/perf/bench-history.jsonl \
            --commit "$COMMIT_SHA" \
            --ref "$COMMIT_REF"

      - name: Commit history update
        if: steps.bench.outputs.ran == 'true'
        run: |
          if git diff --quiet docs/perf/bench-history.jsonl; then
            echo "No bench history delta — skipping commit."
            exit 0
          fi
          git config user.name "aethelred-perf-bot"
          git config user.email "perf@aethelred.org"
          git add docs/perf/bench-history.jsonl
          SHORT_SHA="${COMMIT_SHA:0:8}"
          git commit -m "perf: append bench history for $SHORT_SHA"
          git push

  perf-ok:
    name: Performance passed
    runs-on: ubuntu-latest
    needs: [size, lighthouse]
    if: always()
    env:
      SIZE_RESULT: ${{ needs.size.result }}
      LH_RESULT: ${{ needs.lighthouse.result }}
    steps:
      - name: Summarize
        run: |
          echo "size:       ${SIZE_RESULT}"
          echo "lighthouse: ${LH_RESULT}"
          if [ "${SIZE_RESULT}" != "success" ] \
             || [ "${LH_RESULT}" != "success" ]; then
            echo "Performance gate failed — one or more perf jobs did not succeed."
            exit 1
          fi
          echo "All required performance jobs passed."
