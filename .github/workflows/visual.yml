# ═══════════════════════════════════════════════════════════════
# Aethelred Wallet — Visual regression (Storybook test-runner)
# ═══════════════════════════════════════════════════════════════
# Builds Storybook, runs the @storybook/test-runner (which launches
# a headless browser, visits every story, and snapshots the DOM),
# and diffs against the committed image-snapshot baselines.
#
# Diff images are uploaded as artifacts on failure so a designer can
# review the pixel delta without needing to run Storybook locally.
#
# Security: workflow uses only static strings / controlled env vars.
# No github.event.* values are interpolated into any `run:` block.

name: Visual regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.0'

jobs:
  storybook:
    name: Storybook test-runner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Storybook
        run: pnpm run storybook:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Serve + run test-runner
        run: |
          npx http-server storybook-static -p 6006 &
          sleep 4
          npx test-storybook --url http://127.0.0.1:6006

      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-diff
          path: __image_snapshots__/__diff_output__/
          retention-days: 7
          if-no-files-found: ignore
