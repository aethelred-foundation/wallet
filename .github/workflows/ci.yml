# ═══════════════════════════════════════════════════════════════
# Aethelred Wallet — Continuous Integration
# ═══════════════════════════════════════════════════════════════
# Runs on every push to `main` and every pull request targeting
# `main`. Three independent jobs (typecheck, test, build) run in
# parallel to minimize wall-clock time. A final `ci-ok` aggregation
# job exists purely so branch protection can require a single
# status check that summarizes "all CI phases passed."
#
# Node version pin:
#   We deliberately pin to Node 20 (LTS) instead of using matrix
#   versions. The wallet has a single deployment target (Chrome
#   extension + Expo) whose JS engine behavior is fixed; testing on
#   multiple Node versions would add CI minutes without catching
#   real bugs. Revisit if we ever publish npm packages externally.
#
# Dependency install:
#   `npm ci` refuses to run if package-lock.json is out of date,
#   deletes node_modules first, and is ~2x faster than `npm install`
#   because it skips dependency resolution. This is the canonical
#   CI install command for reproducible builds.
#
# Security hardening:
#   - `permissions` is scoped to minimum (`contents: read`).
#   - No user-controllable input (PR title, commit message, etc.)
#     is ever interpolated into a `run:` block. Any template value
#     that ends up in shell context is piped through `env:` first.
#     See: https://github.blog/security/vulnerability-research/
#          how-to-catch-github-actions-workflow-injections/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows this workflow to be called from release automation later.
  workflow_call:

# Cancel in-flight runs when a new push lands on the same branch.
# Avoids wasting CI minutes on intermediate commits that will be
# superseded by the next push anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum-privilege token scope. `contents: read` is enough to
# checkout and read files; no job here writes to the repo.
permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check all workspaces (strict)
        run: npm run type-check

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run vitest (extension workspace)
        run: npx vitest run --reporter=verbose
        working-directory: apps/extension

  build:
    name: Extension production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Chrome extension
        run: npm run build --workspace @aethelred/wallet-extension

      # Upload the built extension as a CI artifact so we can
      # download and side-load it from any PR for manual review.
      # Retention is 14 days — enough to review a PR without
      # bloating storage.
      - name: Upload extension build
        uses: actions/upload-artifact@v4
        with:
          name: wallet-extension-dist
          path: apps/extension/dist/
          retention-days: 14
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # Test coverage
  # ────────────────────────────────────────────────────────────────
  # Runs the full unit + integration suite with V8 coverage enabled
  # and enforces the thresholds declared in apps/extension/vitest.config.mts.
  # `audit:coverage` post-processes the JSON summary to flag per-file
  # hot spots that the aggregate threshold would otherwise hide.
  # Artefacts (HTML + JSON summary) are uploaded so reviewers can
  # drill into any drop without re-running the suite locally.
  test-coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run vitest with coverage
        run: npm run test:coverage

      - name: Audit per-file coverage hot spots
        run: npm run audit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/extension/coverage/
          retention-days: 30
          if-no-files-found: warn

  # Aggregation job — succeeds only if every prior job succeeded.
  # Branch protection should require THIS check rather than each
  # individual job, so adding/removing jobs doesn't require
  # updating branch protection rules.
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [typecheck, test, build, test-coverage]
    if: always()
    env:
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      TEST_RESULT: ${{ needs.test.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      COVERAGE_RESULT: ${{ needs.test-coverage.result }}
    steps:
      - name: Summarize and fail if any prior job failed
        run: |
          echo "typecheck:     ${TYPECHECK_RESULT}"
          echo "test:          ${TEST_RESULT}"
          echo "build:         ${BUILD_RESULT}"
          echo "test-coverage: ${COVERAGE_RESULT}"
          if [ "${TYPECHECK_RESULT}" != "success" ] \
             || [ "${TEST_RESULT}" != "success" ] \
             || [ "${BUILD_RESULT}" != "success" ] \
             || [ "${COVERAGE_RESULT}" != "success" ]; then
            echo "CI failed — one or more required jobs did not succeed."
            exit 1
          fi
          echo "All required CI jobs passed."
