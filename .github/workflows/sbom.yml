# ═══════════════════════════════════════════════════════════════
# Aethelred Wallet — Software Bill of Materials (SBOM)
# ═══════════════════════════════════════════════════════════════
# Emits a CycloneDX 1.6 SBOM for every push to main and every
# release tag. Two downstream consumers rely on this artifact:
#
#   1. Enterprise customers who require an SBOM alongside each
#      release as part of their vendor-risk-management process
#      (SOC-2 CC6.8, ISO 27001 A.8.8, NIST SSDF PS.3.2).
#   2. The SLSA provenance pipeline in release.yml, which
#      attaches the SBOM as a release asset next to the signed
#      attestation.
#
# TODO: Once the Android (Gradle) and iOS (Swift Package Manager)
# apps are wired up, run `npx cyclonedx/cdxgen` against each for
# deep dependency analysis and merge into the combined SBOM.
#
# Action pinning:
#   Same rule as the other security workflows — full commit SHAs,
#   comment the tag/version for auditability.

name: SBOM

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        # actions/setup-node@v4.1.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate SBOM (CycloneDX 1.6 JSON)
        # @cyclonedx/cyclonedx-npm is pinned in the npm script;
        # specVersion 1.6 is requested explicitly so SBOM
        # consumers that parse strictly on version don't trip on
        # a format bump.
        #
        # `--ignore-npm-errors` tolerates cosmetic `npm ls`
        # validation warnings (peer-dep version mismatches from
        # storybook's still-trailing `vite ^5|^6|^7` range against
        # our installed `vite@8`, plus similar vitest ranges).
        # These are advisory — our tests pass and the build works
        # with the installed versions. The resulting SBOM still
        # captures exactly what ships, since it reads the lockfile
        # directly. Without the flag, cyclonedx-npm refuses to
        # emit any SBOM when npm ls exits non-zero, which is worse
        # than emitting an SBOM with a known-good peer-dep drift.
        run: |
          npx @cyclonedx/cyclonedx-npm \
            --spec-version 1.6 \
            --output-format json \
            --output-file sbom.json \
            --ignore-npm-errors

      - name: Upload SBOM as workflow artifact
        # actions/upload-artifact@v4.4.3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aethelred-wallet-sbom
          path: sbom.json
          retention-days: 90
          if-no-files-found: error
