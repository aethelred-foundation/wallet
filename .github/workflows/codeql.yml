# ═══════════════════════════════════════════════════════════════
# Aethelred Wallet — CodeQL static analysis
# ═══════════════════════════════════════════════════════════════
# CodeQL runs GitHub's semantic analysis over JavaScript and
# TypeScript source to catch data-flow vulnerabilities that regex-
# based linters (including Semgrep) miss: taint tracking from user
# input to sinks (eval/innerHTML/exec), prototype pollution,
# unsafe deserialization, cross-site scripting surfaces.
#
# GitHub CodeQL default setup is the authoritative SARIF uploader for this
# repository. This workflow remains as an explicit build/analysis validation
# gate on every PR and weekly against main; `upload: false` prevents an
# advanced-configuration upload from conflicting with default setup.
#
# CodeQL matrix covers both languages the wallet is built in:
#   - javascript analyzes .js, .mjs, .cjs
#   - typescript analyzes .ts, .tsx
# Listing them as a matrix keeps the two analyses independent so
# a failure in one doesn't mask findings in the other.

name: CodeQL

on:
  pull_request:
    branches: [main, release/wallet-production-readiness]
  push:
    branches: [main]
  # Sunday 04:00 UTC — low-traffic window, picks up new queries.
  schedule:
    - cron: '0 4 * * 0'
  workflow_call:

permissions:
  contents: read
  # The CodeQL action requires this permission for advanced workflows even
  # when this validation-only workflow does not upload its generated SARIF.
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # CodeQL's javascript extractor handles both JS and TS, but
        # we still list them separately to produce two SARIF files
        # so findings are attributed per-language in the UI.
        language: [javascript, typescript]

    steps:
      - name: Checkout repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Initialize CodeQL
        # github/codeql-action/init@v3.35.2
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225
        with:
          languages: ${{ matrix.language }}
          # security-extended pulls in extra CWE coverage beyond
          # the default. security-and-quality adds maintenance
          # queries; we skip those since TS strict + ESLint cover
          # maintenance already.
          queries: security-extended

      - name: Autobuild
        # github/codeql-action/autobuild@v3.35.2
        uses: github/codeql-action/autobuild@95e58e9a2cdfd71adc6e0353d5c52f41a045d225

      - name: Perform CodeQL analysis
        # github/codeql-action/analyze@v3.35.2
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225
        with:
          category: "/language:${{ matrix.language }}"
          # Repository default setup owns code-scanning uploads. Keeping this
          # workflow analysis-only preserves the required PR check without
          # creating a second, mutually-exclusive CodeQL configuration.
          upload: false
