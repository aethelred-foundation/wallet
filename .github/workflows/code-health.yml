# ═══════════════════════════════════════════════════════════════
# Aethelred Wallet - Code-health gates
# ═══════════════════════════════════════════════════════════════
# Machine-checked invariants for the code health surface that is
# too easy to let rot in a monorepo:
#
#   1. dead-exports   - blocks new unused exports from landing.
#   2. circular-deps  - blocks new file-level circular imports AND
#                        workspace-level dependency cycles.
#   3. bundle-weight  - blocks when any package grows by >=10% vs.
#                        the committed minified-output baseline.
#   4. dep-freshness  - weekly cron; non-blocking summary of how
#                        many majors behind each direct dep is.
#
# The hard gates (1-3) feed the `Code health passed` aggregation used
# by branch protection. Dependency freshness remains informational.
#
# Security: all workflow inputs used in `run:` blocks come from
# fixed package.json scripts; no github.event.* interpolation is
# performed into shell contexts.

name: Code health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/wallet-production-readiness]
  schedule:
    # Weekly, Monday 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: code-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.18.0"

jobs:
  dead-exports:
    name: Dead exports (Knip)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check dead exports
        run: pnpm run lint:dead-code

  circular-deps:
    name: Circular deps (madge + workspace graph)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: File-level circular dep check (madge)
        run: pnpm run lint:circular
      - name: Workspace-level circular dep check
        run: pnpm run lint:circular:workspaces
      - name: Upload workspace graph
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-dep-graph
          path: reports/workspace-deps.*
          retention-days: 14
          if-no-files-found: warn

  bundle-weight:
    name: Bundle weight (per-package)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Per-package bundle weight report
        run: pnpm run lint:bundle-weight
      - name: Upload bundle weight report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-weight-report
          path: reports/bundle-weight.json
          retention-days: 30
          if-no-files-found: warn

  dep-freshness:
    name: Dependency freshness (npm registry drift)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Query npm registry for dep freshness
        run: pnpm run lint:dep-freshness
      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dep-freshness-report
          path: reports/dep-freshness.json
          retention-days: 30
          if-no-files-found: warn

  code-health-ok:
    name: Code health passed
    runs-on: ubuntu-latest
    needs: [dead-exports, circular-deps, bundle-weight]
    if: always()
    env:
      DEAD_EXPORTS_RESULT: ${{ needs.dead-exports.result }}
      CIRCULAR_DEPS_RESULT: ${{ needs.circular-deps.result }}
      BUNDLE_WEIGHT_RESULT: ${{ needs.bundle-weight.result }}
    steps:
      - name: Summarize
        run: |
          echo "dead-exports:  ${DEAD_EXPORTS_RESULT}"
          echo "circular-deps: ${CIRCULAR_DEPS_RESULT}"
          echo "bundle-weight: ${BUNDLE_WEIGHT_RESULT}"
          if [ "${DEAD_EXPORTS_RESULT}" != "success" ] \
             || [ "${CIRCULAR_DEPS_RESULT}" != "success" ] \
             || [ "${BUNDLE_WEIGHT_RESULT}" != "success" ]; then
            echo "Code-health gate failed."
            exit 1
          fi
          echo "Code-health gate passed."
